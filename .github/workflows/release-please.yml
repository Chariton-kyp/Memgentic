name: Release Please

# Scans commits since the last release, opens or updates a "chore(main): release X.Y.Z"
# PR with version bumps and CHANGELOG. When merged, creates git tags (v*, api-v*,
# native-v*) that fire the existing publish workflows.
#
# Linked versioning: all 3 packages (memgentic, memgentic-api, memgentic-native)
# always bump together. See .release-please-config.json and
# docs/architecture/release-automation.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open / update Release PR
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          # ``RELEASE_PLEASE_TOKEN`` is a personal access token with
          # ``contents: write`` + ``pull_requests: write`` scopes on this
          # repo. Falling back to ``GITHUB_TOKEN`` silently regresses
          # release automation — tags pushed by GITHUB_TOKEN do NOT
          # trigger the downstream ``release*.yml`` publish workflows
          # (GitHub's recursive-workflow guard). v0.7.0 hit this: tags
          # landed, zero publish jobs fired, PyPI stayed stale until we
          # re-pushed with a user-auth token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # ── Reconcile linked-version tags ──────────────────────────────
      # release-please tags + publishes ONLY a component that had a
      # releasable commit in the window. linked-version-align.yml bumps a
      # quiet component's version *files* to keep the linked group in
      # lockstep, but that component gets no tag / GitHub Release / PyPI
      # publish — so the manifest runs ahead of reality. On the NEXT run
      # release-please then re-scans that component from bootstrap-sha,
      # re-counts an already-shipped breaking change, and proposes a bogus
      # major (this is what pushed memgentic-api to a phantom 2.0.0).
      # This closes the gap: for every component whose manifest version
      # has no matching tag, create the tag at the release commit and push
      # it via the PAT, firing the matching release*.yml publish workflow.
      - name: Checkout for tag reconciliation
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PAT so the tag push fires the downstream release*.yml publish
          # workflows — GITHUB_TOKEN pushes are blocked by the same
          # recursive-workflow guard documented above.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Reconcile linked-version tags
        if: steps.release.outputs.releases_created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA="$(git rev-parse HEAD)"
          MISSING="$(python3 scripts/reconcile_release_tags.py)"
          if [ -z "$MISSING" ]; then
            echo "All linked-version tags present — nothing to reconcile."
            exit 0
          fi
          echo "Backfilling missing release tags at ${SHA}:"
          for tag in $MISSING; do
            echo "  + ${tag}"
            git tag "$tag" "$SHA"
            git push origin "$tag"
          done

      - name: Summary
        if: always()
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          {
            echo "## Release Please"
            echo ""
            echo "- paths_released: ${PATHS_RELEASED:-none}"
            echo "- releases_created: ${RELEASES_CREATED:-false}"
            echo "- pr: ${PR:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
